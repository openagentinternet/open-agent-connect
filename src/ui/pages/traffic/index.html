<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__PAGE_TITLE__</title>
    <link rel="stylesheet" href="/ui/shared.css" />
    <style>
      .traffic-shell {
        display: grid;
        gap: 18px;
      }
      .traffic-toolbar {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--border);
      }
      .traffic-toolbar h1 {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -.01em;
      }
      .traffic-toolbar p {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
      }
      .traffic-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .traffic-card {
        display: grid;
        gap: 12px;
        align-content: start;
      }
      .traffic-seg {
        display: inline-flex;
        align-self: flex-start;
        border: 1px solid var(--border);
        border-radius: 9px;
        overflow: hidden;
      }
      .traffic-seg-btn {
        border: 0;
        border-radius: 0;
        background: var(--surface);
        padding: 8px 16px;
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        color: var(--dim);
        cursor: pointer;
      }
      .traffic-seg-btn[data-active="true"] {
        background: var(--accent-dim);
        color: var(--accent);
      }
      .traffic-seg-btn:disabled {
        opacity: .5;
        cursor: not-allowed;
      }
      .traffic-balance-value {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -.02em;
        color: var(--text);
      }
      .traffic-meter {
        height: 6px;
        border-radius: 999px;
        background: var(--surface2);
        border: 1px solid var(--border);
        overflow: hidden;
      }
      .traffic-meter-fill {
        height: 100%;
        background: var(--accent);
        border-radius: 999px;
        transition: width .2s ease;
      }
      .traffic-balance-stats {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
      }
      .traffic-warning {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border: 1px solid #fde68a;
        border-radius: 9px;
        background: var(--amber-dim);
        color: var(--amber);
        font-size: 12px;
      }
      .traffic-grant {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        padding: 10px 12px;
        border: 1px dashed var(--border2);
        border-radius: 9px;
        background: var(--surface2);
        font-size: 12px;
      }
      .traffic-redeem-row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .traffic-redeem-row input {
        flex: 1;
        min-width: 220px;
      }
      .traffic-summary-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }
      .traffic-stat {
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--surface2);
      }
      .traffic-stat-value {
        font-size: 16px;
        font-weight: 750;
        color: var(--text);
      }
      .traffic-stat-label {
        margin-top: 2px;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .04em;
        color: var(--muted);
      }
      .traffic-ledger-more {
        display: flex;
        justify-content: flex-start;
      }
      .traffic-api-base-row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .traffic-api-base-row input {
        flex: 1;
        min-width: 240px;
      }
      .traffic-code {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .muted {
        color: var(--muted);
      }
      @media (max-width: 900px) {
        .traffic-grid {
          grid-template-columns: 1fr;
        }
        .traffic-summary-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="topbar-logo" href="/ui/hub">MetaBot</a>
        <div class="topbar-sep"></div>
        <span class="topbar-title">__PAGE_EYEBROW__</span>
        <div class="topbar-spacer"></div>
        <nav class="topbar-nav">__PAGE_NAV__</nav>
      </header>
      <main class="content">
        __PAGE_CONTENT__
      </main>
    </div>
    <script>__PAGE_SCRIPT__</script>
  </body>
</html>
