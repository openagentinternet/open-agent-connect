<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__PAGE_TITLE__</title>
    <link rel="stylesheet" href="/ui/shared.css" />
    <style>
      .apps-shell {
        display: grid;
        gap: 16px;
        width: min(1280px, calc(100vw - 48px));
        max-width: 1280px;
        margin: 16px auto 24px;
      }
      .apps-workspace-card {
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
      }
      .apps-toolbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 22px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        flex-wrap: wrap;
      }
      .apps-toolbar h1 {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0;
      }
      .apps-toolbar p,
      .apps-section-header p,
      .apps-section-header span,
      .apps-pagination span {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
      }
      .apps-toolbar-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .apps-toolbar-actions .btn-primary {
        border-color: #bbf7d0;
        background: var(--green-dim);
        color: var(--green);
      }
      .apps-toolbar-actions .btn-primary:hover {
        border-color: #86efac;
        background: #bbf7d0;
        color: var(--green);
      }
      .apps-bot-filter {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 22px;
        border-bottom: 1px solid var(--border);
        background: var(--surface2);
      }
      .apps-bot-filter label {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
      }
      .apps-bot-picker {
        position: relative;
        width: min(280px, 100%);
      }
      .apps-bot-trigger {
        width: 100%;
        min-height: 36px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border: 1px solid var(--border2);
        border-radius: 6px;
        background: var(--surface2);
        color: var(--muted);
        font: 13px var(--sans);
        padding: 4px 8px 4px 10px;
        cursor: pointer;
      }
      .apps-bot-trigger:disabled {
        cursor: not-allowed;
        opacity: 0.65;
      }
      .apps-bot-trigger span:first-child {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .apps-bot-main {
        min-width: 0;
        display: grid;
        gap: 1px;
        text-align: left;
      }
      .apps-bot-main strong,
      .apps-bot-main span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .apps-bot-main strong {
        color: var(--text);
        font-size: 13px;
      }
      .apps-bot-main span {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 10px;
      }
      .apps-bot-avatar {
        width: 24px;
        height: 24px;
        display: inline-grid;
        place-items: center;
        flex: 0 0 auto;
        border: 1px solid var(--border2);
        border-radius: 999px;
        background: var(--surface);
        color: var(--green);
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 700;
      }
      .apps-bot-chevron {
        color: var(--dim);
        font-size: 11px;
      }
      .apps-bot-menu {
        position: absolute;
        z-index: 20;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        display: grid;
        gap: 4px;
        max-height: min(320px, 52vh);
        overflow: auto;
        padding: 6px;
        border: 1px solid var(--border2);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .apps-bot-menu[hidden] {
        display: none;
      }
      .apps-bot-option {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--text);
        font: 13px var(--sans);
        padding: 7px;
        text-align: left;
        cursor: pointer;
      }
      .apps-bot-option:hover,
      .apps-bot-option:focus-visible,
      .apps-bot-option[data-selected="true"] {
        background: var(--green-dim);
        outline: 0;
      }
      .apps-bot-option span:last-child {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .apps-notice {
        display: grid;
        gap: 8px;
        margin: 12px 22px 0;
        border: 1px solid var(--border2);
        border-radius: 8px;
        padding: 12px;
        background: var(--surface);
        color: var(--muted);
        font-size: 12px;
      }
      .apps-gallery {
        display: grid;
        gap: 14px;
        padding: 18px 22px 22px;
      }
      .apps-section-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }
      .apps-section-header h2 {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0;
      }
      .apps-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(248px, 1fr));
        gap: 12px;
        min-height: 300px;
      }
      .apps-card {
        min-width: 0;
        display: grid;
        grid-template-rows: 126px 1fr;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        overflow: hidden;
      }
      .apps-card:hover,
      .apps-card:focus-visible {
        border-color: var(--border2);
        box-shadow: 0 10px 22px rgba(15, 23, 42, 0.08);
        outline: 0;
      }
      .apps-card-cover {
        position: relative;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 10px;
        padding: 12px;
        background: linear-gradient(135deg, #215f4a, #0e4157);
        background-size: cover;
        background-position: center;
      }
      .apps-card-cover .apps-card-icon {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.38);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.9);
        color: #14532d;
        font-family: var(--mono);
        font-size: 14px;
        font-weight: 700;
      }
      .apps-state-pill {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        border: 1px solid #bbf7d0;
        border-radius: 999px;
        background: var(--green-dim);
        color: var(--green);
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 700;
        padding: 2px 8px;
        white-space: nowrap;
      }
      .apps-state-pill.disabled {
        color: var(--amber);
        background: var(--amber-dim);
        border-color: #fde68a;
      }
      .apps-card-body {
        min-width: 0;
        display: grid;
        grid-template-rows: auto auto minmax(38px, auto) auto 1fr;
        gap: 10px;
        padding: 12px;
      }
      .apps-card-title {
        min-width: 0;
        display: grid;
        gap: 3px;
      }
      .apps-card-title h3 {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0;
      }
      .apps-card-title p,
      .apps-card-intro {
        color: var(--muted);
        font-size: 12px;
      }
      .apps-card-title p {
        min-height: 15px;
        font-family: var(--mono);
      }
      .apps-pin-line {
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
      }
      .apps-pin-line code {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1 1 auto;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface2);
        color: var(--muted);
        font-size: 11px;
        padding: 5px 6px;
      }
      .apps-copy-btn {
        flex: 0 0 auto;
        min-height: 26px;
        border: 1px solid var(--border2);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        font: 11px var(--mono);
        padding: 3px 7px;
        cursor: pointer;
      }
      .apps-copy-btn:hover,
      .apps-copy-btn:focus-visible {
        border-color: #bbf7d0;
        background: var(--green-dim);
        color: var(--green);
        outline: 0;
      }
      .apps-card-intro {
        min-height: 38px;
        overflow: hidden;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      .apps-tags {
        min-height: 24px;
        display: flex;
        align-items: flex-start;
        gap: 4px;
        flex-wrap: wrap;
      }
      .apps-tags span {
        min-width: 0;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface2);
        color: var(--muted);
        font-family: var(--mono);
        font-size: 10px;
        padding: 2px 7px;
      }
      .apps-card-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        align-self: end;
      }
      .apps-card-actions .btn {
        min-height: 30px;
        padding: 5px 10px;
      }
      .apps-empty {
        grid-column: 1 / -1;
        min-height: 220px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: 1px dashed var(--border2);
        border-radius: 8px;
        background: var(--surface3);
        text-align: center;
        padding: 24px;
      }
      .apps-empty strong {
        font-size: 14px;
      }
      .apps-empty p {
        max-width: 420px;
        color: var(--muted);
        font-size: 12px;
      }
      .apps-pagination {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        flex-wrap: wrap;
      }
      .apps-pagination span {
        margin: 0;
        min-width: 64px;
        text-align: center;
      }
      @media (max-width: 720px) {
        .apps-shell {
          width: 100%;
          margin: 0;
        }
        .apps-workspace-card {
          border-left: 0;
          border-right: 0;
          border-radius: 0;
        }
        .apps-toolbar,
        .apps-bot-filter,
        .apps-gallery {
          padding-left: 16px;
          padding-right: 16px;
        }
        .apps-bot-filter {
          align-items: stretch;
          flex-direction: column;
        }
        .apps-bot-picker,
        .apps-toolbar-actions {
          width: 100%;
        }
        .apps-toolbar-actions .btn {
          flex: 1 1 140px;
        }
        .apps-grid {
          grid-template-columns: minmax(0, 1fr);
        }
        .apps-card {
          grid-template-rows: 112px 1fr;
        }
        .apps-pagination {
          justify-content: stretch;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="topbar-logo" href="/ui/hub">MetaBot</a>
        <div class="topbar-sep"></div>
        <span class="topbar-title">__PAGE_EYEBROW__</span>
        <div class="topbar-spacer"></div>
        <nav class="topbar-nav">__PAGE_NAV__</nav>
      </header>
      <main class="content">
        __PAGE_CONTENT__
      </main>
    </div>
    <script>__PAGE_SCRIPT__</script>
  </body>
</html>
