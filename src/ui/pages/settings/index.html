<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__PAGE_TITLE__</title>
    <link rel="stylesheet" href="/ui/shared.css" />
    <style>
      .settings-shell {
        display: grid;
        gap: 16px;
      }
      .settings-toolbar {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--border);
      }
      .settings-toolbar h1 {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -.01em;
      }
      .settings-toolbar p {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
      }
      .settings-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .settings-panel {
        min-width: 0;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: rgba(255, 255, 255, 0.92);
        box-shadow: var(--shadow);
        padding: 16px 18px;
      }
      .settings-panel h2 {
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
      }
      .settings-panel p {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }
      .settings-panel code {
        max-width: 220px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--dim);
        overflow-wrap: anywhere;
        text-align: right;
      }
      .settings-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }
      .settings-links a {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        text-decoration: none;
      }
      .settings-links a:hover {
        color: var(--text);
      }
      .settings-panel[data-user-section] {
        flex-direction: column;
        align-items: stretch;
      }
      .settings-user-verbs {
        display: grid;
        gap: 8px;
        margin: 0;
      }
      .settings-user-verb {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        min-width: 0;
      }
      .settings-user-verb dt {
        flex-shrink: 0;
      }
      .settings-user-verb dt code {
        max-width: none;
        text-align: left;
      }
      .settings-user-verb dd {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
        text-align: right;
      }
      .settings-user-note {
        color: var(--dim);
        font-size: 11px;
        line-height: 1.5;
      }
      .settings-panel[data-infrastructure-section] {
        flex-direction: column;
        align-items: stretch;
        grid-column: 1 / -1;
      }
      .settings-infra-form {
        display: grid;
        gap: 12px;
      }
      .settings-infra-field {
        display: grid;
        grid-template-columns: 190px minmax(0, 1fr);
        align-items: center;
        gap: 12px;
      }
      .settings-infra-field span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 650;
      }
      .settings-infra-field input {
        width: 100%;
        min-width: 0;
        height: 36px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface3);
        color: var(--text);
        padding: 0 10px;
        font: 12px/1.2 var(--mono);
      }
      .settings-infra-field input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(46, 111, 237, .12);
        outline: none;
      }
      .settings-infra-field input:disabled { opacity: .65; }
      .settings-tabs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        border-bottom: 1px solid var(--border);
        padding-bottom: 0;
      }
      .settings-tab {
        border: 1px solid transparent;
        border-bottom: 0;
        border-radius: 9px 9px 0 0;
        background: transparent;
        padding: 8px 14px;
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        color: var(--dim);
        cursor: pointer;
      }
      .settings-tab:hover {
        color: var(--text);
        background: var(--surface2);
      }
      .settings-tab[data-active="true"] {
        color: var(--accent);
        background: var(--accent-dim);
      }
      .settings-tabpanel {
        display: grid;
        gap: 14px;
        align-content: start;
      }
      .settings-tab-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .settings-tab-toolbar p {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
      }
      .traffic-pane {
        gap: 18px;
      }
      .traffic-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .traffic-card {
        display: grid;
        gap: 12px;
        align-content: start;
      }
      .traffic-seg {
        display: inline-flex;
        align-self: flex-start;
        border: 1px solid var(--border);
        border-radius: 9px;
        overflow: hidden;
      }
      .traffic-seg-btn {
        border: 0;
        border-radius: 0;
        background: var(--surface);
        padding: 8px 16px;
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        color: var(--dim);
        cursor: pointer;
      }
      .traffic-seg-btn[data-active="true"] {
        background: var(--accent-dim);
        color: var(--accent);
      }
      .traffic-seg-btn:disabled {
        opacity: .5;
        cursor: not-allowed;
      }
      .traffic-balance-value {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -.02em;
        color: var(--text);
      }
      .traffic-balance-stats {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
      }
      .traffic-warning {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border: 1px solid #fde68a;
        border-radius: 9px;
        background: var(--amber-dim);
        color: var(--amber);
        font-size: 12px;
      }
      .traffic-grant {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        padding: 10px 12px;
        border: 1px dashed var(--border2);
        border-radius: 9px;
        background: var(--surface2);
        font-size: 12px;
      }
      .traffic-redeem-row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .traffic-redeem-row input {
        flex: 1;
        min-width: 220px;
      }
      .traffic-summary-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }
      .traffic-stat {
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--surface2);
      }
      .traffic-stat-value {
        font-size: 16px;
        font-weight: 750;
        color: var(--text);
      }
      .traffic-stat-label {
        margin-top: 2px;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .04em;
        color: var(--muted);
      }
      .traffic-ledger-more {
        display: flex;
        justify-content: flex-start;
      }
      .traffic-api-base-row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .traffic-api-base-row input {
        flex: 1;
        min-width: 240px;
      }
      .traffic-code {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      @media (max-width: 820px) {
        .settings-grid,
        .traffic-grid {
          grid-template-columns: 1fr;
        }
        .settings-panel {
          display: grid;
        }
        .settings-panel code,
        .settings-links {
          max-width: none;
          text-align: left;
          justify-content: flex-start;
        }
        .settings-infra-field {
          grid-template-columns: 1fr;
          gap: 5px;
        }
        .traffic-summary-grid {
          grid-template-columns: 1fr;
        }
      }

      /* Settings refresh: a quieter editorial shell with stronger hierarchy. */
      .settings-shell { gap: 22px; }
      .settings-toolbar {
        align-items: flex-start;
        padding: 4px 2px 20px;
        border-bottom-color: rgba(22, 33, 50, .11);
      }
      .settings-heading-block { display: grid; gap: 5px; }
      .settings-kicker, .traffic-card-label {
        color: var(--accent);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: .12em;
        text-transform: uppercase;
      }
      .settings-toolbar h1 { font-size: 28px; letter-spacing: -.035em; line-height: 1.12; }
      .settings-heading-copy { max-width: 620px; color: var(--muted); font-size: 13px; line-height: 1.55; }
      .settings-status-line { margin-top: 4px; color: var(--dim); font-family: var(--mono); font-size: 10px; }
      .settings-refresh { margin-top: 3px; }
      .settings-tabs {
        width: fit-content;
        max-width: 100%;
        gap: 3px;
        padding: 4px;
        border: 1px solid var(--border);
        border-radius: 13px;
        background: rgba(255,255,255,.68);
        box-shadow: 0 5px 18px rgba(19, 35, 67, .05);
      }
      .settings-tab { border: 0; border-radius: 9px; padding: 8px 16px; color: var(--muted); }
      .settings-tab[data-active="true"] { color: var(--text); background: #fff; box-shadow: 0 2px 8px rgba(19, 35, 67, .1); }
      .settings-tabpanel { gap: 16px; }
      .settings-panel, .card {
        border-color: rgba(160, 175, 197, .62);
        border-radius: 16px;
        box-shadow: 0 10px 26px rgba(19, 35, 67, .07);
      }
      .settings-panel { padding: 20px 22px; }
      .settings-panel h2, .card-title { letter-spacing: -.015em; }
      .traffic-pane { gap: 16px; }
      .traffic-intro {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        padding: 2px 2px 6px;
      }
      .traffic-intro h2 { margin-top: 4px; font-size: 25px; letter-spacing: -.035em; line-height: 1.1; }
      .traffic-intro p { max-width: 580px; margin-top: 5px; color: var(--muted); font-size: 13px; line-height: 1.55; }
      .traffic-intro-actions { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; justify-content: flex-end; }
      .traffic-intro-actions p { margin: 0; font-family: var(--mono); font-size: 10px; color: var(--dim); }
      .traffic-status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px var(--green-dim); }
      .traffic-grid { gap: 16px; }
      .traffic-card { gap: 14px; padding: 21px 22px; }
      .traffic-card-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
      .traffic-card-heading > div { display: flex; align-items: baseline; gap: 8px; }
      .traffic-card-index { color: var(--accent); font-family: var(--mono); font-size: 10px; font-weight: 800; letter-spacing: .08em; }
      .traffic-card .card-title { margin: 0; font-size: 15px; }
      .traffic-card-label { color: var(--dim); font-size: 9px; letter-spacing: .1em; }
      .traffic-seg { padding: 3px; border: 1px solid var(--border); border-radius: 11px; background: var(--surface2); gap: 3px; overflow: visible; }
      .traffic-seg-btn { min-width: 92px; border-radius: 8px; padding: 7px 12px; background: transparent; color: var(--muted); transition: background .15s, color .15s, box-shadow .15s; }
      .traffic-seg-btn[data-active="true"] { background: var(--text); color: #fff; box-shadow: 0 3px 9px rgba(22, 33, 50, .2); }
      .traffic-balance-value { font-size: 38px; letter-spacing: -.045em; line-height: 1; }
      .traffic-balance-stats { padding-top: 12px; border-top: 1px solid var(--border); color: var(--dim); }
      .traffic-redeem-row { align-items: stretch; gap: 10px; }
      .traffic-code-input { display: flex; align-items: center; flex: 1 1 240px; min-width: 0; height: 42px; padding: 0 12px; gap: 9px; border: 1px solid var(--border2); border-radius: 11px; background: var(--surface3); color: var(--accent); box-shadow: inset 0 1px 2px rgba(19, 35, 67, .04); }
      .traffic-code-input > span { font-size: 14px; }
      .traffic-code-input input { min-width: 0; width: 100%; height: 100%; padding: 0; border: 0; outline: 0; background: transparent; color: var(--text); font: 12px/1.2 var(--mono); letter-spacing: .05em; }
      .traffic-code-input:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
      .traffic-redeem-row .btn { min-width: 92px; justify-content: center; }
      .traffic-summary-grid { gap: 10px; }
      .traffic-stat { border-radius: 11px; padding: 13px 14px; background: linear-gradient(145deg, var(--surface2), #fff); }
      .traffic-stat-value { font-size: 18px; }
      @media (max-width: 640px) {
        .settings-toolbar, .traffic-intro { display: grid; align-items: start; }
        .settings-toolbar h1 { font-size: 24px; }
        .settings-refresh { justify-self: start; }
        .settings-tabs { width: 100%; }
        .settings-tab { flex: 1; padding-inline: 8px; }
        .traffic-intro-actions { justify-content: flex-start; }
        .traffic-card { padding: 18px; }
        .traffic-card-label { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="topbar-logo" href="/ui/hub">MetaBot</a>
        <div class="topbar-sep"></div>
        <span class="topbar-title">Settings</span>
        <div class="topbar-spacer"></div>
        <nav class="topbar-nav">__PAGE_NAV__</nav>
      </header>
      <main class="content">
        __PAGE_CONTENT__
      </main>
    </div>
    <script>__PAGE_SCRIPT__</script>
  </body>
</html>
