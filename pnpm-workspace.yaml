# pnpm 11 reads pnpm-specific settings (nodeLinker, overrides, build
# approvals) only from this file — .npmrc keeps registry/auth use only.
#
# This is intentionally NOT a multi-package workspace: the root package and
# dsh-plugin/ keep separate lockfiles and installs. Do not add a `packages`
# key here; dsh-plugin has its own pnpm-workspace.yaml.
#
# nodeLinker hoisted keeps the npm-style flat node_modules layout that the
# skillpack build relies on: it vendors the transitive runtime dependency
# closure from the repository root's node_modules, and the shipped runtime
# install.sh templates build from a source checkout via `npm --prefix`.
# Packages are still hard-linked from the global pnpm store, so per-worktree
# install cost stays near zero.
nodeLinker: hoisted

# Ported from the npm `overrides` field (package.json) — pin the same
# transitive versions the npm lockfile enforced.
overrides:
  '@protobufjs/utf8': 1.1.1
  bn.js: 4.12.4
  elliptic: 6.6.1
  # 14.0.2 patches GHSA-3g3m-2fjr-6pw4 (moderate, AbortSignal cancellation
  # bypass); reached via rimraf (^13.0.3 declared — this is a deliberate
  # cross-major override, validated against the rimraf call sites).
  glob: 14.0.2
  # 11.0.1 patches GHSA-g3hv-75wg-m249 (moderate, globparts amplification);
  # reached via glob ^10/^11 declared ranges under rimraf.
  minimatch: 11.0.1
  patch-package: 8.0.1
  protobufjs: 7.6.5
  tmp: 0.2.7
  # 6.29.1 patches GHSA-xjj6-f33q-929c (high) and GHSA-4qv8-2p9j-2685
  # (moderate); reached via @metalet/utxo-wallet-sdk (^6.19.2).
  undici: 6.29.1
  valibot: 1.4.2
  ws: 8.21.0

# Dependencies whose install scripts are allowed to run (pnpm blocks them by
# default). mvc-scrypt applies required patches via postinstall; protobufjs
# generates runtime shims via postinstall. Matches what npm executed.
allowBuilds:
  mvc-scrypt: true
  protobufjs: true

minimumReleaseAgeExclude:
  - '@openagentinternet/agent-browser-core@0.6.3 || 0.7.0 || 0.7.1'
  - '@openagentinternet/agent-browser-host-contract@0.6.3 || 0.7.0 || 0.7.1'
  - '@openagentinternet/agent-browser-name-resolvers@0.6.3 || 0.7.0 || 0.7.1'
  - '@openagentinternet/agent-browser-renderers@0.6.3 || 0.7.0 || 0.7.1'
  - '@openagentinternet/agent-browser-ui@0.6.3 || 0.7.0 || 0.7.1'
  - '@openagentinternet/agent-browser-test-harness@0.6.3 || 0.7.0 || 0.7.1'

# Audit waivers for advisories with no patched upstream release (checked
# 2026-10-07). Both are DoS-class issues in transitive dependencies:
#   - GHSA-vfj7-8cjw-p6xm: braces <=3.0.3 stack exhaustion, reached only via
#     meta-contract > mvc-scrypt > patch-package (postinstall workspace-root
#     detection); braces has no fixed version.
#   - GHSA-hp3w-g68c-fv3c: sprintf-js <=1.1.3 unbounded precision, reached via
#     mammoth > argparse (docx text extraction); no fixed version.
audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-hp3w-g68c-fv3c
