# pnpm 11 reads pnpm-specific settings (nodeLinker, overrides, build
# approvals) only from this file — .npmrc keeps registry/auth use only.
#
# This is intentionally NOT a multi-package workspace: the root package and
# dsh-plugin/ keep separate lockfiles and installs. Do not add a `packages`
# key here; dsh-plugin has its own pnpm-workspace.yaml.
#
# nodeLinker hoisted keeps the npm-style flat node_modules layout that the
# skillpack build relies on: it vendors the transitive runtime dependency
# closure from the repository root's node_modules, and the shipped runtime
# install.sh templates build from a source checkout via `npm --prefix`.
# Packages are still hard-linked from the global pnpm store, so per-worktree
# install cost stays near zero.
nodeLinker: hoisted

# Ported from the npm `overrides` field (package.json) — pin the same
# transitive versions the npm lockfile enforced.
overrides:
  '@protobufjs/utf8': 1.1.1
  bn.js: 4.12.4
  elliptic: 6.6.1
  patch-package: 8.0.1
  protobufjs: 7.6.5
  tmp: 0.2.7
  undici: 6.28.0
  valibot: 1.4.2
  ws: 8.21.0

# Dependencies whose install scripts are allowed to run (pnpm blocks them by
# default). mvc-scrypt applies required patches via postinstall; protobufjs
# generates runtime shims via postinstall. Matches what npm executed.
allowBuilds:
  mvc-scrypt: true
  protobufjs: true
