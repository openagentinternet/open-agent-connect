# OAC-on-DSH agent preset: mounts the MetaBot CLI tool plugins.
#
# This file is the INSTALL TEMPLATE. `node dsh/install.mjs` copies it (with the
# `plugins/` directory) into `${DSH_HOME:-$HOME/.dsh}/.agent-presets/oac/` and
# bakes this checkout's built CLI entry point (`<repo>/dist/cli/main.js`) into
# every row's `cliPath` config below. Keep the placeholder token in this repo
# copy; only the installed copy carries a concrete path.
#
# Every row is a self-contained CommonJS Cordis plugin that registers
# `metabot_*` model tools into the host `tools` registry and provides no
# services, so the rows need no isolate realm. They consume the host `tools`
# service (hard dependency via `inject`) exactly like the shipped `tool-bash`
# row does.
- id: oac-identity
  name: './plugins/oac-identity.js'
  config:
    cliPath: '{{CLI_PATH}}'

- id: oac-bot
  name: './plugins/oac-bot.js'
  config:
    cliPath: '{{CLI_PATH}}'

- id: oac-network
  name: './plugins/oac-network.js'
  config:
    cliPath: '{{CLI_PATH}}'

- id: oac-buzz
  name: './plugins/oac-buzz.js'
  config:
    cliPath: '{{CLI_PATH}}'

- id: oac-chat
  name: './plugins/oac-chat.js'
  config:
    cliPath: '{{CLI_PATH}}'

- id: oac-services
  name: './plugins/oac-services.js'
  config:
    cliPath: '{{CLI_PATH}}'

- id: oac-trace
  name: './plugins/oac-trace.js'
  config:
    cliPath: '{{CLI_PATH}}'

- id: oac-wallet
  name: './plugins/oac-wallet.js'
  config:
    cliPath: '{{CLI_PATH}}'

- id: oac-files
  name: './plugins/oac-files.js'
  config:
    cliPath: '{{CLI_PATH}}'

- id: oac-metaapp
  name: './plugins/oac-metaapp.js'
  config:
    cliPath: '{{CLI_PATH}}'

- id: oac-browser
  name: './plugins/oac-browser.js'
  config:
    cliPath: '{{CLI_PATH}}'

- id: oac-system
  name: './plugins/oac-system.js'
  config:
    cliPath: '{{CLI_PATH}}'
