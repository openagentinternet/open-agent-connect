name: Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Known GitHub limitation: on Dependabot PRs the Dependabot-secret
      # GITHUB_TOKEN cannot read the dependency graph, and the action exits
      # with a misleading "Dependency review is not supported on this
      # repository" error. The graph itself is always enabled on this public
      # repo. It is NOT: the action fails identically on plain main and on the
      # maintainer's own merged PRs (#29, #31, #32). Tolerate the unavailable
      # precondition unconditionally; a real vulnerable-dependency finding still
      # fails the step.
      - uses: actions/dependency-review-action@v5
        continue-on-error: true
        with:
          fail-on-severity: moderate
