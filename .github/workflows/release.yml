name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Build runtime
        run: npm run build

      - name: Build skillpacks
        run: npm run build:skillpacks

      - name: Verify release version
        run: node scripts/verify-release-version.mjs "${{ github.ref_name }}"

      - name: Build release packs
        run: node scripts/build-release-packs.mjs

      - name: Publish GitHub Release
        run: |
          RELEASE_TAG="${{ github.ref_name }}"
          ASSETS=(
            release/packs/oac-codex.tar.gz
            release/packs/oac-claude-code.tar.gz
            release/packs/oac-openclaw.tar.gz
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish npm package
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "open-agent-connect@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "open-agent-connect@$PACKAGE_VERSION is already published; skipping npm publish."
          else
            npm publish --access public
          fi

      - name: Build DSH plugin
        run: |
          npm ci --prefix dsh-plugin
          npm run build --prefix dsh-plugin

      # The DSH plugin rides an independent version line (dsh-plugin/package.json,
      # currently 0.4.x tied to the DSH kernel surface, not the core version).
      # The duplicate-version guard makes this a no-op on tags where the plugin
      # version did not change. Requires the npm Trusted Publisher for
      # open-agent-connect-dsh (repo openagentinternet/open-agent-connect,
      # workflow release.yml) — configured after the one-time manual first
      # publish, since npm cannot trust-publish a package that does not exist.
      - name: Publish DSH plugin package
        run: |
          PLUGIN_VERSION="$(node -p "require('./dsh-plugin/package.json').version")"
          if npm view "open-agent-connect-dsh@$PLUGIN_VERSION" version >/dev/null 2>&1; then
            echo "open-agent-connect-dsh@$PLUGIN_VERSION is already published; skipping npm publish."
          else
            cd dsh-plugin && npm publish --access public
          fi
