name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Enable pnpm
        run: corepack enable

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'dsh-plugin/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # npm publish / npm view stay on the npm CLI on purpose: the npm
      # Trusted Publisher (OIDC) flow for this repo is configured for the
      # npm CLI and pnpm publish does not support it.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate

      - name: Build runtime
        run: pnpm run build

      - name: Build skillpacks
        run: pnpm run build:skillpacks

      - name: Verify release version
        run: node scripts/verify-release-version.mjs "${{ github.ref_name }}"

      - name: Build release packs
        run: node scripts/build-release-packs.mjs

      - name: Publish GitHub Release
        run: |
          RELEASE_TAG="${{ github.ref_name }}"
          ASSETS=(
            release/packs/oac-codex.tar.gz
            release/packs/oac-claude-code.tar.gz
            release/packs/oac-openclaw.tar.gz
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish npm package
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "open-agent-connect@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "open-agent-connect@$PACKAGE_VERSION is already published; skipping npm publish."
          else
            npm publish --access public
          fi

      - name: Build DSH plugin
        run: |
          pnpm --dir dsh-plugin install --frozen-lockfile
          pnpm --dir dsh-plugin run build

      # The DSH plugin rides an independent version line (dsh-plugin/package.json,
      # currently 0.4.x tied to the DSH kernel surface, not the core version).
      # The duplicate-version guard makes this a no-op on tags where the plugin
      # version did not change. Requires the npm Trusted Publisher for
      # open-agent-connect-dsh (repo openagentinternet/open-agent-connect,
      # workflow release.yml) — configured after the one-time manual first
      # publish, since npm cannot trust-publish a package that does not exist.
      - name: Publish DSH plugin package
        run: |
          PLUGIN_VERSION="$(node -p "require('./dsh-plugin/package.json').version")"
          if npm view "open-agent-connect-dsh@$PLUGIN_VERSION" version >/dev/null 2>&1; then
            echo "open-agent-connect-dsh@$PLUGIN_VERSION is already published; skipping npm publish."
          else
            cd dsh-plugin && npm publish --access public
          fi
