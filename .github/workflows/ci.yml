name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable pnpm
        run: corepack enable

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build runtime
        run: pnpm run build

      - name: Build skillpacks
        run: pnpm run build:skillpacks

      - name: Verify generated artifacts are current
        run: git diff --exit-code -- skillpacks release/compatibility.json

      - name: Run tests
        run: pnpm test

      - name: Verify release metadata
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/verify-release-version.mjs "v${VERSION}"

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate
