<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__PAGE_TITLE__</title>
    <link rel="stylesheet" href="/ui/shared.css" />
    <style>
      .tracking-shell {
        display: grid;
        gap: 18px;
      }
      .tracking-toolbar {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--border);
      }
      .tracking-toolbar h1 {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -.01em;
      }
      .tracking-toolbar p {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
      }
      .tracking-toolbar-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .tracking-tabs {
        display: flex;
        gap: 4px;
      }
      .tracking-notice {
        margin: 0;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 13px;
        background: var(--accent-dim);
        color: var(--accent);
      }
      .tracking-board {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 12px;
      }
      .tracking-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        cursor: pointer;
      }
      .tracking-card:hover {
        border-color: var(--accent);
      }
      .tracking-card-title {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
      }
      .tracking-card-brief {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .tracking-progress {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .tracking-progress-bar {
        flex: 1;
        height: 6px;
        border-radius: 3px;
        background: var(--border);
        overflow: hidden;
      }
      .tracking-progress-fill {
        height: 100%;
        border-radius: 3px;
        background: var(--accent);
      }
      .tracking-card-foot {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        font-size: 12px;
        color: var(--muted);
      }
      .tracking-detail {
        display: grid;
        gap: 12px;
      }
      .status-dot.status-settled,
      .status-dot.status-completed {
        background: var(--accent);
      }
      .status-dot.status-inProgress {
        background: var(--accent);
      }
      .muted {
        color: var(--muted);
      }
      .tracking-draft {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.35);
      }
      .tracking-draft[hidden] {
        display: none;
      }
      .tracking-draft .card {
        width: min(680px, 92vw);
        display: grid;
        gap: 10px;
      }
      .tracking-draft-text {
        box-sizing: border-box;
        width: 100%;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 18px;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        resize: vertical;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="topbar-logo" href="/ui/hub">MetaBot</a>
        <div class="topbar-sep"></div>
        <span class="topbar-title">__PAGE_EYEBROW__</span>
        <div class="topbar-spacer"></div>
        <nav class="topbar-nav">__PAGE_NAV__</nav>
      </header>
      <main class="content">
        __PAGE_CONTENT__
      </main>
    </div>
    <script>__PAGE_SCRIPT__</script>
  </body>
</html>
