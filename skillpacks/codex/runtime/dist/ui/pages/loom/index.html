<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__PAGE_TITLE__</title>
    <link rel="stylesheet" href="/ui/shared.css" />
    <style>
      .loom-shell { display: grid; gap: 14px; min-width: 0; }
      .loom-toolbar {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px;
        display: grid;
        gap: 12px;
      }
      .loom-toolbar-main,
      .loom-toolbar-context,
      .loom-filters,
      .loom-status-line {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        flex-wrap: wrap;
      }
      .loom-toolbar-main { justify-content: space-between; }
      .loom-kicker {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--muted);
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      .loom-toolbar h1,
      .loom-detail h2 {
        font-size: 18px;
        line-height: 1.2;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .loom-icon-button {
        width: 34px;
        height: 34px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border2);
        background: var(--surface2);
        color: var(--text);
        cursor: pointer;
        font-family: var(--mono);
        font-size: 16px;
      }
      .loom-icon-button:hover { border-color: var(--accent); color: var(--accent); }
      .loom-icon-button:disabled { opacity: .55; cursor: wait; }
      .loom-context-item {
        min-width: 150px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 7px 9px;
        background: var(--panel, var(--surface2));
      }
      .loom-context-item span,
      .loom-filters label span,
      .loom-metric span,
      .loom-bot-text span {
        display: block;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: .06em;
        text-transform: uppercase;
      }
      .loom-context-item strong {
        display: block;
        margin-top: 2px;
        font-size: 12px;
        font-family: var(--mono);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .loom-context-warning {
        color: var(--amber);
        font-family: var(--mono);
        font-size: 11px;
        overflow-wrap: anywhere;
      }
      .loom-filters label { display: grid; gap: 4px; min-width: 132px; }
      .loom-filter-query { min-width: min(280px, 100%); flex: 1 1 220px; }
      .loom-filters select,
      .loom-filters input {
        width: 100%;
        min-height: 34px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border2);
        background: var(--bg);
        color: var(--text);
        padding: 7px 9px;
        font: 12px var(--mono);
      }
      .loom-status-line {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
      }
      [data-loom-status][data-tone="ready"] { color: var(--green); }
      [data-loom-status][data-tone="busy"] { color: var(--amber); }
      [data-loom-status][data-tone="error"],
      [data-loom-error] { color: var(--red); }
      .loom-metrics {
        display: grid;
        grid-template-columns: repeat(8, minmax(112px, 1fr));
        gap: 8px;
      }
      .loom-metric {
        min-height: 64px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        padding: 10px;
      }
      .loom-metric strong {
        display: block;
        margin-top: 5px;
        font-family: var(--mono);
        font-size: 18px;
      }
      .loom-metric[data-tone="warning"] strong { color: var(--amber); }
      .loom-workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(330px, 400px);
        gap: 14px;
        align-items: start;
      }
      .loom-board {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(228px, 1fr);
        gap: 10px;
        overflow-x: auto;
        padding-bottom: 4px;
      }
      .loom-column {
        min-height: 520px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 10px;
      }
      .loom-column header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      .loom-column h2 {
        font-size: 12px;
        font-family: var(--mono);
        font-weight: 500;
      }
      .loom-column header span,
      .loom-chip,
      .loom-copy {
        font-family: var(--mono);
        font-size: 10px;
        border-radius: 4px;
        border: 1px solid var(--border2);
        color: var(--muted);
        background: var(--surface2);
      }
      .loom-column header span { padding: 2px 7px; }
      .loom-column-list { display: grid; gap: 8px; }
      .loom-task-card {
        min-height: 220px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface2);
        padding: 10px;
        display: grid;
        gap: 8px;
        cursor: pointer;
        transition: border-color .15s, transform .15s, background .15s;
      }
      .loom-task-card:hover,
      .loom-task-card.is-selected {
        border-color: var(--accent);
        background: var(--surface3);
      }
      .loom-task-card:hover { transform: translateY(-1px); }
      .loom-card-top,
      .loom-card-footer,
      .loom-card-pin,
      .loom-inline-copy,
      .loom-detail-copy {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        flex-wrap: wrap;
      }
      .loom-card-top { justify-content: space-between; align-items: flex-start; }
      .loom-card-top h3 {
        font-size: 13px;
        line-height: 1.25;
        font-weight: 600;
        overflow-wrap: anywhere;
        max-width: 100%;
      }
      .loom-state {
        flex: 0 0 auto;
        max-width: 100%;
        border-radius: 4px;
        padding: 2px 7px;
        font-family: var(--mono);
        font-size: 10px;
        color: var(--accent);
        background: var(--accent-dim);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .loom-state[data-tone="warning"] { color: var(--amber); background: var(--amber-dim); }
      .loom-state[data-tone="success"] { color: var(--green); background: var(--green-dim); }
      .loom-state[data-tone="danger"] { color: var(--red); background: var(--red-dim); }
      .loom-card-pin,
      .loom-card-meta,
      .loom-task-card p,
      .loom-empty-column,
      .loom-empty-board,
      .loom-empty-detail,
      .loom-detail-section p {
        color: var(--muted);
        font-size: 11px;
        overflow-wrap: anywhere;
      }
      .loom-copy {
        padding: 2px 6px;
        cursor: pointer;
      }
      .loom-copy:hover { color: var(--text); border-color: var(--accent); }
      .loom-card-bots,
      .loom-identity-grid {
        display: grid;
        gap: 7px;
      }
      .loom-bot {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .loom-avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: 1px solid var(--border2);
        object-fit: cover;
        flex: 0 0 auto;
      }
      .loom-avatar-fallback {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--accent-dim);
        color: var(--text);
        font: 600 11px var(--mono);
      }
      .loom-bot-text { min-width: 0; }
      .loom-bot-text strong,
      .loom-bot-text small {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .loom-bot-text strong { font-size: 12px; }
      .loom-bot-text small {
        color: var(--dim);
        font: 10px var(--mono);
      }
      .loom-bot-empty { color: var(--muted); font: 11px var(--mono); }
      .loom-card-meta {
        display: grid;
        gap: 3px;
        font-family: var(--mono);
      }
      .loom-tag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        min-width: 0;
      }
      .loom-chip {
        padding: 2px 7px;
        text-decoration: none;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .loom-chip.warning { color: var(--amber); background: var(--amber-dim); }
      .loom-detail {
        position: sticky;
        top: 66px;
        max-height: calc(100vh - 84px);
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 14px;
      }
      .loom-detail-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: flex-start;
        margin-bottom: 10px;
      }
      .loom-detail-actors {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-top: 10px;
      }
      .loom-detail-section {
        border-top: 1px solid var(--border);
        padding-top: 12px;
        margin-top: 12px;
        display: grid;
        gap: 8px;
      }
      .loom-detail-section h3 {
        font-size: 11px;
        font-family: var(--mono);
        color: var(--text);
        font-weight: 500;
        letter-spacing: .04em;
      }
      .loom-detail code,
      .loom-inline-copy code {
        max-width: 100%;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 3px 5px;
        font: 10px var(--mono);
        overflow-wrap: anywhere;
      }
      .loom-claim,
      .loom-warning-list li,
      .loom-timeline li,
      .loom-local-evidence,
      .loom-raw-record,
      .loom-handoff {
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 8px;
        background: var(--surface2);
      }
      .loom-claim-meta,
      .loom-author-row,
      .loom-repo-detail,
      .loom-raw-record {
        display: grid;
        gap: 6px;
      }
      .loom-claim-meta span,
      .loom-author-row span,
      .loom-repo-detail,
      .loom-raw-record,
      .loom-mini-list {
        color: var(--muted);
        font-size: 11px;
        overflow-wrap: anywhere;
      }
      .loom-repo-detail a,
      .loom-raw-record a {
        color: var(--accent);
        text-decoration: none;
        overflow-wrap: anywhere;
      }
      .loom-repo-detail a:hover,
      .loom-raw-record a:hover { text-decoration: underline; }
      .loom-mini-list {
        display: grid;
        gap: 3px;
        list-style-position: inside;
        padding-left: 0;
      }
      .loom-warning-list,
      .loom-timeline {
        display: grid;
        gap: 8px;
        list-style: none;
      }
      .loom-warning-list strong { color: var(--amber); }
      .loom-timeline li div:first-child {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        color: var(--text);
        font-size: 12px;
      }
      .loom-timeline span {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 10px;
        white-space: nowrap;
      }
      .loom-handoff {
        display: grid;
        gap: 8px;
      }
      .loom-handoff a {
        color: var(--accent);
        text-decoration: none;
        font: 12px var(--mono);
        overflow-wrap: anywhere;
      }
      .loom-handoff a:hover { text-decoration: underline; }
      .loom-local-evidence {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 11px;
      }
      .loom-local-evidence a { color: var(--accent); overflow-wrap: anywhere; }
      .loom-commit-list {
        display: grid;
        gap: 6px;
      }
      .loom-commit {
        display: grid;
        gap: 4px;
        border-top: 1px solid var(--border);
        padding-top: 6px;
      }
      .loom-commit small {
        color: var(--dim);
        font: 10px var(--mono);
        overflow-wrap: anywhere;
      }
      @media (max-width: 1100px) {
        .loom-metrics { grid-template-columns: repeat(4, minmax(112px, 1fr)); }
        .loom-workspace { grid-template-columns: 1fr; }
        .loom-detail { position: static; max-height: none; }
      }
      @media (max-width: 680px) {
        .loom-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .loom-toolbar-main { align-items: flex-start; }
        .loom-filters label { min-width: 100%; }
        .loom-detail-actors { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="topbar-logo" href="/ui/hub">MetaBot</a>
        <div class="topbar-sep"></div>
        <span class="topbar-title">__PAGE_EYEBROW__</span>
        <div class="topbar-spacer"></div>
        <nav class="topbar-nav">__PAGE_NAV__</nav>
      </header>
      <main class="content">
        __PAGE_CONTENT__
      </main>
    </div>
    <script>__PAGE_SCRIPT__</script>
  </body>
</html>
