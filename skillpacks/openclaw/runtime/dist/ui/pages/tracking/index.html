<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__PAGE_TITLE__</title>
    <link rel="stylesheet" href="/ui/shared.css" />
    <style>
      .tracking-shell {
        display: grid;
        gap: 14px;
      }
      .tracking-toolbar {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--border);
      }
      .tracking-toolbar h1 {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -.01em;
      }
      .tracking-toolbar p {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
      }
      .tracking-toolbar-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .tracking-tabs {
        display: flex;
        gap: 4px;
      }
      .tracking-notice {
        margin: 0;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 13px;
        background: var(--accent-dim);
        color: var(--accent);
      }
      .tracking-draft {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.35);
      }
      .tracking-draft[hidden] {
        display: none;
      }
      .tracking-draft .card {
        width: min(680px, 92vw);
        display: grid;
        gap: 10px;
      }
      .tracking-draft-text {
        box-sizing: border-box;
        width: 100%;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 18px;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        resize: vertical;
      }

      /* ── MetaTask UI port (DSH plugin fidelity layer, local theme tokens) ── */
      .oac-mt-board, .oac-mt-detail { display: flex; flex-direction: column; gap: 12px; }
      .oac-mt-board-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      .oac-mt-board-meta { display: flex; align-items: center; gap: 8px; }
      .oac-mt-notice { padding: 8px 12px; border-radius: 8px; font-size: 13px; line-height: 20px; background: var(--accent-dim); color: var(--accent); }
      .oac-mt-notice-warn { background: rgba(248,113,113,0.12); color: #b91c1c; }
      .oac-mt-empty { padding: 28px 16px; text-align: center; font-size: 14px; color: var(--muted); }
      .oac-mt-empty-inline { font-size: 13px; color: var(--muted); }
      .oac-mt-alerts { display: flex; flex-direction: column; gap: 6px; }
      .oac-mt-alert { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; background: rgba(245,184,61,0.10); font-size: 13px; }
      .oac-mt-alert-kind { font-weight: 500; color: #b45309; }
      .oac-mt-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
      .oac-mt-card { display: flex; flex-direction: column; gap: 8px; padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: 0 1px 2px rgba(15,23,42,.05); cursor: pointer; text-align: left; font-family: inherit; }
      .oac-mt-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px -2px rgba(15,23,42,.12); }
      .oac-mt-card-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
      .oac-mt-card-title { font-size: 15px; font-weight: 600; color: var(--text); }
      .oac-mt-card-brief { font-size: 13px; line-height: 19px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .oac-mt-progress { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
      .oac-mt-progress-bar { flex: 1; height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; }
      .oac-mt-progress-fill { height: 100%; border-radius: 3px; background: #34d399; }
      .oac-mt-card-foot { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); align-items: center; }
      .oac-mt-card-stamp { width: 100%; }
      .oac-mt-card-share b { color: var(--text); }
      .oac-mt-card-pub { display: inline-flex; align-items: center; gap: 5px; }
      .oac-mt-chip { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; font-size: 12px; line-height: 18px; background: var(--surface2); color: var(--muted); }
      .oac-mt-chip-role { background: rgba(52,211,153,0.15); color: #047857; }
      .oac-mt-badge { display: inline-flex; padding: 1px 8px; border-radius: 6px; font-size: 12px; line-height: 18px; }
      .oac-mt-badge-open { background: var(--surface2); color: var(--muted); }
      .oac-mt-badge-inProgress { background: rgba(56,189,248,0.15); color: #0369a1; }
      .oac-mt-badge-completed { background: rgba(52,211,153,0.18); color: #047857; }
      .oac-mt-badge-settled { background: #f5b83d; color: #1f2937; }
      .oac-mt-badge-verdict-pass { background: rgba(52,211,153,0.18); color: #047857; }
      .oac-mt-badge-verdict-fail { background: rgba(248,113,113,0.18); color: #b91c1c; }
      .oac-mt-badge-cand-winner, .oac-mt-badge-cand-leading { background: #f5b83d; color: #1c1917; }
      .oac-mt-badge-cand-behind { background: rgba(52,211,153,0.18); color: #047857; }
      .oac-mt-badge-cand-inReview { background: rgba(56,189,248,0.18); color: #0369a1; }
      .oac-mt-badge-cand-awaitingDeps, .oac-mt-badge-cand-optimistic { background: rgba(167,139,250,0.18); color: #6d28d9; }
      .oac-mt-badge-cand-rejected { background: rgba(248,113,113,0.18); color: #b91c1c; }
      .oac-mt-badge-cand-replaced, .oac-mt-badge-cand-stalled { background: var(--surface2); color: var(--muted); }
      .oac-mt-badge-leadgold { background: #f5b83d; color: #1c1917; }
      .oac-mt-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; }
      .oac-mt-dot-open { background: var(--surface2); border: 1px solid var(--muted); }
      .oac-mt-dot-claimed { background: #38bdf8; }
      .oac-mt-dot-verified { background: #34d399; }
      .oac-mt-mono { font-family: var(--mono); font-size: 11px; }
      .oac-mt-dim { color: var(--muted); }

      /* buttons */
      .oac-mt-btn { display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-family: inherit; font-size: 12px; font-weight: 600; line-height: 1; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
      .oac-mt-btn:hover { filter: brightness(.96); }
      .oac-mt-btn:disabled { opacity: .55; cursor: default; }
      .oac-mt-btn-sm { padding: 5px 10px; font-size: 11.5px; }
      .oac-mt-btn-xs { padding: 3px 8px; font-size: 10.5px; border-radius: 6px; }
      .oac-mt-btn-primary { background: #d97706; border-color: #d97706; color: #fff; }

      /* identity badge (avatar + name + local chip) */
      .oac-mt-badge-id { display: inline-flex; align-items: center; gap: 6px; min-width: 0; vertical-align: middle; }
      .oac-mt-badge-avatar { width: 20px; height: 20px; border-radius: 6px; object-fit: cover; flex: none; }
      .oac-mt-badge-id-md .oac-mt-badge-avatar { width: 30px; height: 30px; border-radius: 8px; }
      .oac-mt-badge-initial { display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 10px; font-weight: 700; }
      .oac-mt-badge-id-md .oac-mt-badge-initial { font-size: 14px; }
      .oac-mt-badge-name { font-size: 12.5px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .oac-mt-badge-id-md .oac-mt-badge-name { font-size: 15px; }
      .oac-mt-you { flex: none; font-size: 9px; font-weight: 700; letter-spacing: .05em; padding: 1px 5px; border-radius: 4px; background: #38bdf8; color: #0b1220; }
      .oac-mt-badge-id .oac-mt-you { margin-left: 2px; }

      /* section cards */
      .oac-mt-sectioncard { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-sizing: border-box; }
      .oac-mt-h3 { margin: 0; font-size: 14px; font-weight: 650; color: var(--text); display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
      .oac-mt-h3 small { font-size: 11.5px; font-weight: 400; color: var(--muted); }
      .oac-mt-h4 { margin: 0 0 6px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

      /* detail header */
      .oac-mt-detail-head { display: flex; flex-direction: column; align-items: stretch; gap: 8px; }
      .oac-mt-back { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; padding: 0; border: none; background: none; font-family: inherit; font-size: 12.5px; color: var(--muted); cursor: pointer; }
      .oac-mt-back:hover { color: var(--text); }
      .oac-mt-titleline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .oac-mt-title { font-size: 17px; font-weight: 650; color: var(--text); }
      .oac-mt-head-join { margin-left: auto; }
      .oac-mt-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
      .oac-mt-sep { color: var(--muted); }
      .oac-mt-brief { margin: 0; font-size: 12.5px; line-height: 1.6; color: var(--muted); cursor: pointer; }
      .oac-mt-brief-clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

      /* explainer + status line */
      .oac-mt-explainer { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12.5px; line-height: 1.5; color: var(--text); padding: 10px 14px; border: 1px solid var(--border); border-left: 3px solid #f5b83d; border-radius: 10px; background: var(--surface); }
      .oac-mt-explainer-sep { color: var(--muted); }
      .oac-mt-gold-word { font-weight: 700; color: #b45309; }
      .oac-mt-sky-word { font-weight: 700; color: #0284c7; }
      .oac-mt-statusline { display: flex; gap: 22px; flex-wrap: wrap; font-size: 12px; color: var(--text); }
      .oac-mt-status-item { display: inline-flex; align-items: center; gap: 6px; }
      .oac-mt-status-item b { font-weight: 650; }
      .oac-mt-status-item code { font-family: var(--mono); font-size: 11px; }
      .oac-mt-dot-gold, .oac-mt-dot-sky { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
      .oac-mt-dot-gold { background: #f5b83d; }
      .oac-mt-dot-sky { background: #38bdf8; }
      .oac-mt-rules { padding: 8px 12px; border-radius: 8px; font-size: 13px; line-height: 20px; background: var(--surface2); color: var(--muted); }

      /* how-to-join + mine */
      .oac-mt-howto { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border: 1px solid rgba(2,132,199,.3); background: rgba(2,132,199,.05); border-radius: 10px; }
      .oac-mt-openchips { display: flex; flex-wrap: wrap; gap: 6px; }
      .oac-mt-openchip { display: inline-flex; align-items: center; gap: 6px; max-width: 240px; font-family: inherit; font-size: 11.5px; padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(2,132,199,.5); background: transparent; color: #0369a1; cursor: pointer; }
      .oac-mt-openchip code { font-family: var(--mono); font-size: 10.5px; }
      .oac-mt-mine { display: flex; flex-direction: column; gap: 6px; }
      .oac-mt-minecard { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); overflow: hidden; }
      .oac-mt-minerow { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 12px; border: none; border-bottom: 1px solid var(--border); background: transparent; font-family: inherit; font-size: 12px; text-align: left; cursor: pointer; }
      .oac-mt-minerow:last-child { border-bottom: none; }
      .oac-mt-minerow:hover { background: var(--accent-hover); }
      .oac-mt-minedot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
      .oac-mt-minedot-claim { background: #38bdf8; }
      .oac-mt-minedot-sub-winner, .oac-mt-minedot-sub-verified { background: #34d399; }
      .oac-mt-minedot-sub-live, .oac-mt-minedot-sub-replaced { background: #f5b83d; }
      .oac-mt-minedot-sub-rejected { background: #f87171; }
      .oac-mt-minedot-vote-pass { background: #34d399; }
      .oac-mt-minedot-vote-fail { background: #f87171; }
      .oac-mt-minenode { flex: none; font-family: var(--mono); font-size: 11px; color: var(--muted); }
      .oac-mt-minetext { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
      .oac-mt-minestatus { flex: none; margin-left: auto; font-size: 11px; color: var(--muted); }

      /* deliverables */
      .oac-mt-deliverables { display: flex; flex-direction: column; gap: 8px; }
      .oac-mt-dlv-hero { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border: 1px solid rgba(245,184,61,.55); border-radius: 12px; background: linear-gradient(135deg, rgba(245,184,61,.07), transparent); }
      .oac-mt-dlv-type { flex: none; width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; background: #f5b83d; color: #1c1917; }
      .oac-mt-dlv-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
      .oac-mt-dlv-kicker { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #b45309; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      .oac-mt-dlv-name { font-size: 15px; font-weight: 650; color: var(--text); }
      .oac-mt-dlv-members { display: flex; gap: 6px; flex-wrap: wrap; }
      .oac-mt-memberchip { font-family: var(--mono); font-size: 10.5px; padding: 1px 7px; border-radius: 5px; border: 1px solid var(--border); color: var(--muted); background: var(--surface); }
      .oac-mt-memberchip-mini { font-family: var(--mono); font-size: 10.5px; padding: 1px 7px; border-radius: 5px; border: 1px solid var(--border); color: var(--muted); background: var(--surface); }
      .oac-mt-dlv-rows, .oac-mt-dlv-progress { display: flex; flex-direction: column; gap: 6px; }
      .oac-mt-dlv-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); font-size: 13px; flex-wrap: wrap; }
      .oac-mt-dlv-rowtype { flex: none; width: 24px; height: 24px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }
      .oac-mt-dlv-rowtype-git { background: rgba(99,102,241,.12); }
      .oac-mt-dlv-rowtype-metafile { background: rgba(16,185,129,.12); }
      .oac-mt-dlv-rowtype-metaapp { background: rgba(245,158,11,.12); }
      .oac-mt-dlv-rowmain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: 12px; }
      .oac-mt-dlv-rowmain b { font-size: 12.5px; }
      .oac-mt-dlv-git code { font-family: var(--mono); font-size: 11.5px; }
      .oac-mt-uri { font-family: var(--mono); font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--surface2); word-break: break-all; }
      .oac-mt-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .oac-mt-summary { padding: 10px 12px; border-radius: 8px; background: var(--surface2); font-size: 13px; line-height: 20px; color: var(--text); }
      .oac-mt-fact { font-size: 12px; color: var(--muted); }
      .oac-mt-fact code { font-family: var(--mono); }
      .oac-mt-pinlink { font-size: 10.5px; }

      /* chain view */
      .oac-mt-chainview { display: flex; flex-direction: column; gap: 8px; }
      .oac-mt-chainview-scroll { overflow-x: auto; padding: 4px 0 8px; }
      /* The SVG lives INSIDE the w-max content box: the overlay is literal
         scrolled content and cannot drift away from the cards. */
      .oac-mt-edges { position: absolute; top: 0; left: 0; pointer-events: none; display: block; }
      .oac-mt-columns { position: relative; display: flex; gap: 40px; align-items: flex-start; padding: 10px 6px 14px; width: max-content; min-width: 100%; box-sizing: border-box; }
      .oac-mt-col { width: 216px; flex: none; display: flex; flex-direction: column; gap: 8px; }
      .oac-mt-stephead { padding: 0 2px; }
      .oac-mt-stephead-row { display: flex; align-items: baseline; gap: 6px; }
      .oac-mt-stepchip { flex: none; font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--border); color: var(--muted); }
      .oac-mt-stepchip-finish { color: #b45309; border-color: rgba(245,184,61,.6); }
      .oac-mt-steptitle { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .oac-mt-stepmeta { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; margin-top: 3px; }
      .oac-mt-stepword { font-size: 11px; color: var(--muted); }
      .oac-mt-stepword-gold { font-size: 11px; font-weight: 600; color: #b45309; }
      .oac-mt-stepweight { flex: none; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
      .oac-mt-rule { height: 2px; border-radius: 1px; margin-top: 6px; background: var(--border); }
      .oac-mt-rule-gold { background: #f5b83d; }
      .oac-mt-rule-goldgrad { background: linear-gradient(90deg, #f5b83d, rgba(245,184,61,.3)); }
      .oac-mt-rule-done { background: #34d399; }
      .oac-mt-rule-finish { background: repeating-linear-gradient(90deg, rgba(245,184,61,.5) 0 8px, transparent 8px 14px); }
      .oac-mt-cand { position: relative; display: flex; flex-direction: column; gap: 6px; width: 100%; box-sizing: border-box; text-align: left; font-family: inherit; padding: 10px 11px 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
      .oac-mt-cand:hover { transform: translateY(-1px); }
      .oac-cand-winner, .oac-cand-leading { border-color: #f5b83d; box-shadow: 0 0 0 1px #f5b83d, 0 0 16px -4px rgba(245,184,61,.35); }
      .oac-cand-behind { border-color: rgba(52,211,153,.55); }
      .oac-cand-inReview, .oac-cand-inreview { border-style: dashed; border-color: rgba(56,189,248,.6); }
      .oac-cand-awaitingDeps, .oac-cand-awaiting, .oac-cand-optimistic { border-style: dotted; border-color: rgba(167,139,250,.6); }
      .oac-cand-onrace.oac-cand-inReview, .oac-cand-onrace.oac-cand-inreview { border-style: solid; border-color: #38bdf8; box-shadow: 0 0 10px -3px rgba(56,189,248,.45); }
      .oac-cand-replaced { opacity: .4; }
      .oac-cand-rejected { opacity: .45; }
      .oac-cand-rejected .oac-mt-badge-name { text-decoration: line-through; }
      .oac-cand-stalled { border-style: dashed; border-color: rgba(100,116,139,.55); opacity: .65; }
      .oac-cand-emptybox { border-style: dashed; text-align: center; font-size: 11px; color: var(--muted); cursor: default; white-space: pre-line; }
      .oac-mt-cand-meta { display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: var(--muted); }
      .oac-mt-cand-meta code { font-family: var(--mono); }
      .oac-mt-statetag { position: absolute; top: -7px; right: 8px; font-size: 9px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: var(--surface); }
      .oac-mt-statetag-lg { position: static; font-size: 10px; padding: 2px 8px; }
      .oac-tag-solid-gold { background: #f5b83d; color: #1c1917; }
      .oac-tag-solid-sky { background: #38bdf8; color: #0b1220; }
      .oac-tag-line-emerald { color: #059669; border: 1px solid rgba(52,211,153,.6); }
      .oac-tag-line-sky { color: #0284c7; border: 1px solid rgba(56,189,248,.6); }
      .oac-tag-line-violet { color: #7c3aed; border: 1px solid rgba(167,139,250,.6); }
      .oac-tag-line-red { color: #dc2626; border: 1px solid rgba(248,113,113,.6); }
      .oac-tag-line-slate { color: #64748b; border: 1px solid rgba(100,116,139,.6); }
      .oac-tag-cand-winner, .oac-tag-cand-leading { background: #f5b83d; color: #1c1917; }
      .oac-tag-cand-behind { color: #059669; border: 1px solid rgba(52,211,153,.6); }
      .oac-tag-cand-inReview, .oac-tag-cand-inreview { color: #0284c7; border: 1px solid rgba(56,189,248,.6); }
      .oac-tag-cand-awaitingDeps, .oac-tag-cand-awaiting, .oac-tag-cand-optimistic { color: #7c3aed; border: 1px solid rgba(167,139,250,.6); }
