<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__PAGE_TITLE__</title>
    <link rel="stylesheet" href="/ui/shared.css" />
    <style>
      .memory-shell {
        display: grid;
        gap: 18px;
      }
      .memory-toolbar {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--border);
      }
      .memory-toolbar h1 {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -.01em;
      }
      .memory-toolbar p {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
      }
      .memory-tabs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        border-bottom: 1px solid var(--border);
      }
      .memory-tab {
        padding: 8px 14px;
        border: 1px solid transparent;
        border-bottom: none;
        border-radius: var(--radius) var(--radius) 0 0;
        background: transparent;
        font: inherit;
        font-size: 13px;
        color: var(--muted);
        cursor: pointer;
        transition: color .15s, background .15s;
      }
      .memory-tab:hover {
        color: var(--text);
        background: var(--surface3);
      }
      .memory-tab[data-active="true"] {
        color: var(--accent);
        background: var(--accent-dim);
        border-color: var(--accent-border);
        font-weight: 650;
      }
      .memory-panel {
        display: grid;
        gap: 14px;
        min-width: 0;
      }
      .memory-filters {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: end;
      }
      .memory-filters .field {
        min-width: 180px;
      }
      .memory-filters .field.memory-filter-grow {
        flex: 1 1 220px;
      }
      .memory-list {
        display: grid;
        gap: 10px;
      }
      .memory-row {
        display: grid;
        gap: 8px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface3);
      }
      .memory-row-head {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .memory-row-head strong {
        font-size: 13px;
        color: var(--text);
        overflow-wrap: anywhere;
      }
      .memory-row-meta {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .memory-row-text {
        margin: 0;
        font-size: 13px;
        line-height: 1.6;
        color: var(--text);
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .memory-row-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .memory-row[data-active="false"] {
        opacity: .75;
      }
      .memory-edit-form,
      .memory-add-form {
        display: grid;
        gap: 10px;
        padding: 12px 14px;
        border: 1px solid var(--accent-border);
        border-radius: var(--radius);
        background: var(--accent-dim);
      }
      .memory-add-form {
        border-color: var(--border);
        background: var(--surface3);
      }
      .memory-form-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .memory-archived {
        display: grid;
        gap: 8px;
        padding: 12px 14px;
        border: 1px dashed var(--border2);
        border-radius: var(--radius);
      }
      .memory-archived-title {
        margin: 0;
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
      }
      .memory-archived-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
      }
      .memory-archived-row span {
        overflow-wrap: anywhere;
      }
      .memory-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        align-items: start;
      }
      .memory-contact-list {
        display: grid;
        gap: 8px;
      }
      .memory-contact {
        display: grid;
        gap: 4px;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface3);
        text-align: left;
        font: inherit;
        cursor: pointer;
        transition: border-color .15s, background .15s;
      }
      .memory-contact:hover {
        border-color: var(--border2);
        background: var(--surface2);
      }
      .memory-contact-name {
        font-size: 13px;
        font-weight: 650;
        color: var(--text);
        overflow-wrap: anywhere;
      }
      .memory-contact-id {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .memory-contact-summary {
        margin: 2px 0 0;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.55;
        overflow-wrap: anywhere;
      }
      .memory-contact-detail {
        display: grid;
        gap: 10px;
      }
      .memory-identity {
        margin: 0;
        font-size: 13px;
        line-height: 1.65;
        color: var(--text);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .memory-diary {
        display: grid;
        gap: 10px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface3);
      }
      .memory-diary-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        width: 100%;
        padding: 0;
        border: none;
        background: transparent;
        font: inherit;
        cursor: pointer;
        text-align: left;
      }
      .memory-diary-head strong {
        font-size: 13px;
        color: var(--text);
      }
      .memory-diary-head .memory-row-meta {
        flex-shrink: 0;
      }
      .memory-diary-text {
        margin: 0;
        padding: 4px 0 4px 12px;
        border-left: 3px solid var(--border2);
        font-size: 13px;
        font-style: italic;
        line-height: 1.7;
        color: var(--text);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .memory-diary-sections {
        display: grid;
        gap: 4px;
      }
      .memory-diary-sections p {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .memory-due-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--text);
      }
      .memory-run-error {
        margin-top: 4px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--red);
        overflow-wrap: anywhere;
      }
      .memory-counts {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
      }
      .status-pill[data-memory-pulse="true"] .status-dot {
        animation: pulse 1.2s ease-in-out infinite;
      }
      @media (max-width: 980px) {
        .memory-grid {
          grid-template-columns: 1fr;
        }
        .memory-filters .field {
          min-width: 140px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="topbar-logo" href="/ui/hub">MetaBot</a>
        <div class="topbar-sep"></div>
        <span class="topbar-title">__PAGE_EYEBROW__</span>
        <div class="topbar-spacer"></div>
        <nav class="topbar-nav">__PAGE_NAV__</nav>
      </header>
      <main class="content">
        __PAGE_CONTENT__
      </main>
    </div>
    <script>__PAGE_SCRIPT__</script>
  </body>
</html>
