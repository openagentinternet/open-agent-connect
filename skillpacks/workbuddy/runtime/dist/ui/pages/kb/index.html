<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__PAGE_TITLE__</title>
    <link rel="stylesheet" href="/ui/shared.css" />
    <style>
      .kb-shell {
        display: grid;
        gap: 18px;
      }
      .kb-toolbar {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--border);
      }
      .kb-toolbar h1 {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -.01em;
      }
      .kb-toolbar p {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
      }
      .kb-layout {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        gap: 14px;
        align-items: start;
      }
      .kb-list-card {
        display: grid;
        gap: 12px;
        align-content: start;
        position: sticky;
        top: 72px;
      }
      .kb-list {
        display: grid;
        gap: 8px;
      }
      .kb-row {
        display: grid;
        gap: 4px;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface3);
        text-align: left;
        font: inherit;
        cursor: pointer;
        transition: border-color .15s, background .15s;
      }
      .kb-row:hover {
        border-color: var(--border2);
        background: var(--surface2);
      }
      .kb-row[data-selected="true"] {
        border-color: var(--accent-border);
        background: var(--accent-dim);
      }
      .kb-row-head {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .kb-row-head strong {
        font-size: 13px;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .kb-row-meta {
        font-size: 11px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .kb-create {
        display: grid;
        gap: 10px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }
      .kb-create .card-title {
        margin-bottom: 0;
        font-size: 13px;
      }
      .kb-main {
        display: grid;
        gap: 14px;
        min-width: 0;
      }
      .kb-detail-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .kb-detail-head .card-title {
        margin-bottom: 4px;
      }
      .kb-detail-actions {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
      }
      .kb-detail-meta {
        margin: 12px 0;
      }
      .kb-detail-body {
        display: grid;
        gap: 10px;
      }
      .kb-check {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--text);
      }
      .kb-learn-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .kb-doc-form {
        display: grid;
        gap: 10px;
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid var(--border);
      }
      .kb-doc-form .card-title {
        margin-bottom: 0;
        font-size: 13px;
      }
      .kb-query-form,
      .kb-study-form {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: end;
        margin-bottom: 8px;
      }
      .kb-study-form {
        grid-template-columns: minmax(0, 1fr) 120px auto;
      }
      .kb-query-scope {
        max-width: 260px;
      }
      .kb-query-results {
        display: grid;
        gap: 10px;
        margin-top: 10px;
      }
      .kb-query-count {
        font-size: 11px;
        color: var(--dim);
      }
      .kb-query-group {
        display: grid;
        gap: 8px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface3);
      }
      .kb-query-group > strong {
        font-size: 12px;
        color: var(--text);
      }
      .kb-hit {
        display: grid;
        gap: 3px;
        padding-top: 8px;
        border-top: 1px solid var(--border);
      }
      .kb-hit-title {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .kb-hit .section-badge {
        justify-self: start;
        font-size: 10px;
        padding: 2px 7px;
      }
      .kb-hit p {
        font-size: 12px;
        color: var(--text);
        line-height: 1.55;
        overflow-wrap: anywhere;
      }
      .kb-job-error {
        margin-top: 4px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--red);
        overflow-wrap: anywhere;
      }
      .kb-job-summary {
        margin-top: 4px;
        font-size: 11px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      @media (max-width: 980px) {
        .kb-layout {
          grid-template-columns: 1fr;
        }
        .kb-list-card {
          position: static;
        }
        .kb-query-form,
        .kb-study-form {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="topbar-logo" href="/ui/hub">MetaBot</a>
        <div class="topbar-sep"></div>
        <span class="topbar-title">__PAGE_EYEBROW__</span>
        <div class="topbar-spacer"></div>
        <nav class="topbar-nav">__PAGE_NAV__</nav>
      </header>
      <main class="content">
        __PAGE_CONTENT__
      </main>
    </div>
    <script>__PAGE_SCRIPT__</script>
  </body>
</html>
